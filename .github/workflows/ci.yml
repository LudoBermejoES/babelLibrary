name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-static:
    name: Rust fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust tests (babel-gen + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  frontend:
    name: Frontend typecheck + unit tests + build
    runs-on: ubuntu-latest
    needs: [wasm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
      - run: npm ci
        working-directory: web
      - run: npm run typecheck:test
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  wasm:
    name: Build wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked --version 0.15.0
      # scripts/wasm-build.sh prepends a macOS-only rustup path that simply
      # doesn't exist on this Linux runner (bash skips missing PATH entries);
      # the dtolnay/rust-toolchain action above already puts the correct
      # wasm-target-enabled toolchain first on PATH.
      - run: ./scripts/wasm-build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: [wasm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
