name: Release

# Runs ONLY on an explicit human action — never automatically from a
# commit, push, or tag. Two ways to trigger it, both deliberate:
#   1. workflow_dispatch — click "Run workflow" on GitHub, or
#      `gh workflow run release.yml` from the CLI.
#   2. Publishing a GitHub Release through the GitHub UI.
# Routine commits (including the version bump + tag push described in
# CLAUDE.md) do NOT trigger this workflow, by design — CI minutes and
# any Docker registry costs are only spent when a release is wanted.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (optional; defaults to the version in package.json)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build (and push) Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
