[package]
name = "babel-gen"
version.workspace = true
edition.workspace = true
description = "Deterministic procedural layout generator for the babelLibrary 3D library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.103"
rand = "0.9"
rand_pcg = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.126"

[dev-dependencies]
proptest = "1"
